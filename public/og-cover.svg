<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">DevChallenge AI</title>
  <desc id="description">Devowy quiz od AI, publiczny link i porównanie wyników</desc>
  <defs>
    <linearGradient
      id="accent"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#d47a42"
      />
      <stop
        offset="1"
        stop-color="#2f9e78"
      />
    </linearGradient>
    <radialGradient
      id="glow"
      cx="50%"
      cy="50%"
      r="50%"
    >
      <stop
        offset="0"
        stop-color="#d47a42"
        stop-opacity=".28"
      />
      <stop
        offset="1"
        stop-color="#d47a42"
        stop-opacity="0"
      />
    </radialGradient>
    <pattern
      id="grid"
      width="44"
      height="44"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M 44 0 L 0 0 0 44"
        fill="none"
        stroke="#f5f2e9"
        stroke-opacity=".055"
        stroke-width="1"
      />
    </pattern>
    <filter
      id="shadow"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feDropShadow
        dx="0"
        dy="22"
        stdDeviation="24"
        flood-color="#000"
        flood-opacity=".32"
      />
    </filter>
  </defs>

  <rect
    width="1200"
    height="630"
    fill="#0f100f"
  />
  <rect
    width="1200"
    height="630"
    fill="url(#grid)"
  />
  <circle
    cx="1010"
    cy="116"
    r="330"
    fill="url(#glow)"
  />
  <circle
    cx="111"
    cy="603"
    r="250"
    fill="url(#glow)"
    opacity=".55"
  />

  <g transform="translate(72 66)">
    <rect
      width="48"
      height="48"
      rx="12"
      fill="#d47a42"
    />
    <path
      d="m17 15 12 9-12 9"
      fill="none"
      stroke="#292620"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <text
      x="64"
      y="35"
      fill="#f5f2e9"
      font-family="Arial, Helvetica, sans-serif"
      font-size="29"
      font-weight="700"
      letter-spacing="-.5"
    >
      DevChallenge
      <tspan fill="#d47a42">AI</tspan>
    </text>
  </g>

  <g
    transform="translate(72 181)"
    font-family="Arial, Helvetica, sans-serif"
  >
    <text
      fill="#f5f2e9"
      font-size="70"
      font-weight="800"
      letter-spacing="-2.4"
    >
      <tspan
        x="0"
        y="0"
      >
        Stwórz challenge.
      </tspan>
      <tspan
        x="0"
        y="82"
        fill="url(#accent)"
      >
        Wyślij link.
      </tspan>
      <tspan
        x="0"
        y="164"
      >
        Porównaj wyniki.
      </tspan>
    </text>
    <text
      x="2"
      y="227"
      fill="#f5f2e9"
      fill-opacity=".66"
      font-size="24"
      font-weight="400"
    >
      Devowe zagadki generowane z pomocą AI
    </text>
  </g>

  <g
    transform="translate(735 155)"
    filter="url(#shadow)"
    font-family="Arial, Helvetica, sans-serif"
  >
    <rect
      width="394"
      height="328"
      rx="24"
      fill="#181917"
      stroke="#f5f2e9"
      stroke-opacity=".14"
      stroke-width="2"
    />
    <g transform="translate(28 28)">
      <circle
        cx="7"
        cy="7"
        r="7"
        fill="#d6534d"
      />
      <circle
        cx="31"
        cy="7"
        r="7"
        fill="#d47a42"
      />
      <circle
        cx="55"
        cy="7"
        r="7"
        fill="#2f9e78"
      />
      <text
        x="0"
        y="66"
        fill="#2f9e78"
        font-family="Menlo, Consolas, monospace"
        font-size="17"
        font-weight="700"
      >
        // async / await
      </text>
      <text
        x="0"
        y="108"
        fill="#f5f2e9"
        font-family="Menlo, Consolas, monospace"
        font-size="18"
      >
        const result = await solve()
      </text>
      <rect
        x="0"
        y="139"
        width="338"
        height="50"
        rx="10"
        fill="#d47a42"
        fill-opacity=".16"
        stroke="#d47a42"
        stroke-opacity=".62"
      />
      <text
        x="18"
        y="171"
        fill="#f5f2e9"
        font-size="17"
        font-weight="700"
      >
        A. Promise&lt;number&gt;
      </text>
      <rect
        x="0"
        y="201"
        width="338"
        height="50"
        rx="10"
        fill="#2f9e78"
        fill-opacity=".1"
        stroke="#2f9e78"
        stroke-opacity=".36"
      />
      <text
        x="18"
        y="233"
        fill="#f5f2e9"
        fill-opacity=".82"
        font-size="17"
      >
        B. number
      </text>
      <text
        x="0"
        y="278"
        fill="#f5f2e9"
        fill-opacity=".5"
        font-family="Menlo, Consolas, monospace"
        font-size="14"
      >
        wynik · czas · leaderboard
      </text>
    </g>
  </g>

  <g
    transform="translate(72 552)"
    font-family="Menlo, Consolas, monospace"
    font-size="14"
    font-weight="700"
    letter-spacing="1.1"
  >
    <rect
      width="128"
      height="32"
      rx="16"
      fill="#d47a42"
      fill-opacity=".16"
      stroke="#d47a42"
      stroke-opacity=".55"
    />
    <text
      x="64"
      y="21"
      text-anchor="middle"
      fill="#e6a57c"
    >
      QUIZ OD AI
    </text>
    <rect
      x="142"
      width="158"
      height="32"
      rx="16"
      fill="#2f9e78"
      fill-opacity=".1"
      stroke="#2f9e78"
      stroke-opacity=".45"
    />
    <text
      x="221"
      y="21"
      text-anchor="middle"
      fill="#72c5a6"
    >
      PUBLICZNY LINK
    </text>
    <rect
      x="314"
      width="146"
      height="32"
      rx="16"
      fill="#f5f2e9"
      fill-opacity=".06"
      stroke="#f5f2e9"
      stroke-opacity=".18"
    />
    <text
      x="387"
      y="21"
      text-anchor="middle"
      fill="#f5f2e9"
      fill-opacity=".72"
    >
      LEADERBOARD
    </text>
  </g>
</svg>
